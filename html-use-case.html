<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SLT Presentation — Cue Card</title>
<style>
  :root{
    --bg: #0F1B2D;
    --bg-card: #16263E;
    --bg-card-open: #1C3150;
    --ink: #EDF1F7;
    --ink-dim: #9FB0C7;
    --line: #28405F;
    --gold: #D4A24C;
    --gold-dim: #8A7141;
    --good: #5FB894;
    --warn: #E0895B;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body{
    padding: 18px 16px 40px;
    max-width: 560px;
    margin: 0 auto;
  }

  header{
    padding: 6px 2px 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
  }
  .eyebrow{
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 6px;
  }
  h1{
    font-size: 21px;
    line-height: 1.25;
    margin: 0 0 4px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .byline{
    font-size: 12.5px;
    color: var(--gold);
    margin: 0 0 8px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .sub{
    font-size: 13.5px;
    color: var(--ink-dim);
    margin: 0;
  }

  /* Timer */
  .timer-box{
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 20px;
  }
  .timer-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 12px;
  }
  .timer-clock{
    font-variant-numeric: tabular-nums;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .timer-target{
    font-size: 11.5px;
    color: var(--ink-dim);
    margin-top: 2px;
  }
  .timer-btns{ display:flex; gap:8px; }
  .timer-btns button{
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    font-size: 13px;
    font-weight: 600;
    padding: 9px 14px;
    border-radius: 10px;
    cursor:pointer;
  }
  .timer-btns button.primary{
    background: var(--gold);
    border-color: var(--gold);
    color: #1B1305;
  }
  .progress-track{
    margin-top: 12px;
    height: 6px;
    border-radius: 4px;
    background: #0B1524;
    overflow: hidden;
  }
  .progress-fill{
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    transition: width 1s linear, background 0.3s;
  }

  /* Section cards */
  .section{
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .section.open{ background: var(--bg-card-open); border-color: #35507A; }
  .section-head{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 14px 14px;
    cursor: pointer;
  }
  .num{
    flex: 0 0 auto;
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    font-size: 12.5px;
    font-weight: 700;
    display:flex; align-items:center; justify-content:center;
  }
  .section-title-wrap{ flex: 1 1 auto; min-width: 0; }
  .section-title{
    font-size: 14.5px;
    font-weight: 700;
    line-height: 1.3;
  }
  .section-time{
    font-size: 11.5px;
    color: var(--ink-dim);
    margin-top: 1px;
  }
  .chev{
    flex: 0 0 auto;
    font-size: 13px;
    color: var(--ink-dim);
    transition: transform 0.25s ease;
  }
  .section.open .chev{ transform: rotate(90deg); color: var(--gold); }

  .section-body{
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
  }
  .section.open .section-body{ max-height: 900px; }
  .section-body-inner{
    padding: 0 16px 16px 52px;
  }
  ul{ margin:0; padding:0; list-style:none; }
  li{
    position: relative;
    padding-left: 16px;
    margin-bottom: 8px;
    font-size: 13.5px;
    line-height: 1.45;
    color: var(--ink);
  }
  li::before{
    content: "";
    position:absolute;
    left: 0; top: 8px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--gold);
  }
  li.note{
    color: var(--ink-dim);
    font-style: italic;
  }
  li.note::before{ background: var(--ink-dim); }
  .say-it{
    margin-top: 8px;
    padding: 10px 12px;
    background: rgba(212,162,76,0.08);
    border-left: 2px solid var(--gold);
    border-radius: 6px;
    font-size: 13px;
    color: var(--ink);
  }
  .say-it b{ color: var(--gold); font-weight:700; }

  /* Q&A section distinct */
  .qa-section .num{ border-color: var(--good); color: var(--good); }
  .qa-item{
    margin-bottom: 14px;
  }
  .qa-item:last-child{ margin-bottom: 0; }
  .qa-q{
    font-size: 13.5px;
    font-weight: 700;
    color: var(--good);
    margin-bottom: 5px;
  }

  .controls{
    display:flex;
    gap: 8px;
    margin: 4px 0 16px;
  }
  .controls button{
    flex:1;
    border: 1px solid var(--line);
    background: var(--bg-card);
    color: var(--ink-dim);
    font-size: 12.5px;
    font-weight: 600;
    padding: 10px;
    border-radius: 10px;
    cursor:pointer;
  }

  footer{
    text-align:center;
    color: var(--ink-dim);
    font-size: 11px;
    margin-top: 22px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">GC Projects · SLT Update</div>
  <h1>Interactive HTML Dashboards</h1>
  <p class="byline">Compiled by Sujit Kulkarni</p>
  <p class="sub">Cue card — tap a section to expand. Built for 15–20 min.</p>
</header>

<div class="timer-box">
  <div class="timer-row">
    <div>
      <div class="timer-clock" id="clock">00:00</div>
      <div class="timer-target" id="targetLabel">Target: 20:00 total</div>
    </div>
    <div class="timer-btns">
      <button id="startPause" class="primary">Start</button>
      <button id="reset">Reset</button>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
</div>

<div class="controls">
  <button id="expandAll">Expand all</button>
  <button id="collapseAll">Collapse all</button>
</div>

<div id="sections"></div>

<footer>Tap Start when the meeting begins · bar turns amber then coral as time runs down</footer>

<script>
const sections = [
  {
    title: "What's included?",
    time: "~3 min",
    items: [
      "Works from anything you already have — Excel, PPT, even copy-pasted notes or emails can feed into the dashboard",
      "Built using M365 Copilot — no new tooling, licensing, or dev team needed",
      "Filterable views (team / date / project)",
      "Auto-refresh — no manual copy-paste updates",
      "Drill-down — click a summary metric to see what's driving it",
      "Single shareable link instead of an attached file — always the latest version",
    ],
    say: "If demoing: show the live dashboard here rather than keep listing features."
  },
  {
    title: "What problem was it solving?",
    time: "~3 min",
    items: [
      "Manual daily rebuild of Excel/PPT reports — time-consuming",
      "Version control issues — multiple copies, unclear which is current",
      "Data often stale by the time it reached decision-makers",
      "Time spent formatting slides instead of analysing numbers",
    ],
    say: "Add a real number if you have one — hours/week saved, or a specific miss caused by stale data."
  },
  {
    title: "How does it solve those problems?",
    time: "~3–4 min",
    items: [
      "Single source of truth — no more copy-paste between tools",
      "Updates automatically — always current",
      "Self-serve filtering — people get their own cut without asking your team",
      "Frees up your team's time — less manual maintenance, more analysis",
      "Consistent formatting — no \"which version has the right numbers\"",
    ]
  },
  {
    title: "How could it help others across GC Projects?",
    time: "~4–5 min",
    items: [
      "Reusable pattern, not a one-off — same Copilot-driven approach works for any recurring report",
      "No new tooling, licensing, or dev dependency — any team can do this with what they already have",
      "Candidates: risk logs, budget tracking, status reporting, resource allocation",
      "Low barrier — doesn't need a technical specialist",
      "Reduces duplicate effort — multiple teams likely solving the same problem independently",
    ],
    say: "Keep the framing soft: \"happy to share the approach,\" not \"everyone should adopt this.\""
  },
  {
    title: "Is anyone else using it / looking at it?",
    time: "~2 min",
    items: [
      "Currently: our team only",
      "Pivot forward, don't leave it flat: \"I'd welcome a pilot with another team\"",
      "Mention any informal interest already expressed, if there is any",
    ]
  },
  {
    title: "Close / next steps",
    time: "~2–3 min",
    items: [
      "State one clear ask: sign-off to pilot elsewhere, time with another team lead, or feedback on scaling it",
      "One sentence, one ask — don't leave it open-ended",
    ]
  }
];

const qa = [
  { q: "Time / effort saved?", a: ["Removes daily manual rebuild of Excel/PPT", "Insert real number if available: X hours/week saved"] },
  { q: "Effort to set up for another team?", a: ["Built in M365 Copilot — no development work needed", "Mostly structuring existing data", "Realistic timeline: a day to a few days, depending on complexity"] },
  { q: "Security / where does data live?", a: ["Sits within existing M365 environment", "Follows same access/security controls already in place", "If unsure on specifics: \"I'll confirm and follow up\" — don't guess"] },
  { q: "Does this replace existing reporting tools?", a: ["No — not a full replacement", "Best suited for recurring reports that take manual effort to update", "Complements existing tools rather than replacing them"] },
  { q: "\"Why hasn't this rolled out already?\"", a: ["Proven first with our own team's daily dashboard", "Natural next step: pilot with one other team before wider rollout"] },
];

const container = document.getElementById('sections');

function buildSection(s, index){
  const div = document.createElement('div');
  div.className = 'section';
  const itemsHtml = s.items.map(t => `<li>${t}</li>`).join('');
  const sayHtml = s.say ? `<div class="say-it"><b>Say it:</b> ${s.say}</div>` : '';
  div.innerHTML = `
    <div class="section-head">
      <div class="num">${index+1}</div>
      <div class="section-title-wrap">
        <div class="section-title">${s.title}</div>
        <div class="section-time">${s.time}</div>
      </div>
      <div class="chev">▸</div>
    </div>
    <div class="section-body">
      <div class="section-body-inner">
        <ul>${itemsHtml}</ul>
        ${sayHtml}
      </div>
    </div>
  `;
  div.querySelector('.section-head').addEventListener('click', () => {
    div.classList.toggle('open');
  });
  return div;
}

sections.forEach((s, i) => container.appendChild(buildSection(s, i)));

// Q&A block
const qaDiv = document.createElement('div');
qaDiv.className = 'section qa-section';
const qaInner = qa.map(item => `
  <div class="qa-item">
    <div class="qa-q">${item.q}</div>
    <ul>${item.a.map(t => `<li>${t}</li>`).join('')}</ul>
  </div>
`).join('');
qaDiv.innerHTML = `
  <div class="section-head">
    <div class="num">Q</div>
    <div class="section-title-wrap">
      <div class="section-title">Likely Q&amp;A</div>
      <div class="section-time">Reserve ~3–5 min</div>
    </div>
    <div class="chev">▸</div>
  </div>
  <div class="section-body">
    <div class="section-body-inner">
      ${qaInner}
      <div class="say-it"><b>Fallback:</b> "I'll follow up on that" beats improvising into a shaky elaboration.</div>
    </div>
  </div>
`;
qaDiv.querySelector('.section-head').addEventListener('click', () => qaDiv.classList.toggle('open'));
container.appendChild(qaDiv);

document.getElementById('expandAll').addEventListener('click', () => {
  document.querySelectorAll('.section').forEach(s => s.classList.add('open'));
});
document.getElementById('collapseAll').addEventListener('click', () => {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('open'));
});

// Timer
const TARGET_SECONDS = 20 * 60;
let elapsed = 0;
let running = false;
let intervalId = null;

const clockEl = document.getElementById('clock');
const fillEl = document.getElementById('progressFill');
const startPauseBtn = document.getElementById('startPause');
const resetBtn = document.getElementById('reset');

function formatTime(sec){
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = Math.floor(sec%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

function tick(){
  elapsed += 1;
  clockEl.textContent = formatTime(elapsed);
  const pct = Math.min(100, (elapsed / TARGET_SECONDS) * 100);
  fillEl.style.width = pct + '%';
  if(pct < 70){
    fillEl.style.background = 'linear-gradient(90deg, var(--gold-dim), var(--gold))';
  } else if(pct < 95){
    fillEl.style.background = 'linear-gradient(90deg, var(--gold), var(--warn))';
  } else {
    fillEl.style.background = 'var(--warn)';
  }
}

startPauseBtn.addEventListener('click', () => {
  running = !running;
  if(running){
    intervalId = setInterval(tick, 1000);
    startPauseBtn.textContent = 'Pause';
  } else {
    clearInterval(intervalId);
    startPauseBtn.textContent = 'Start';
  }
});

resetBtn.addEventListener('click', () => {
  clearInterval(intervalId);
  running = false;
  elapsed = 0;
  clockEl.textContent = '00:00';
  fillEl.style.width = '0%';
  fillEl.style.background = 'linear-gradient(90deg, var(--gold-dim), var(--gold))';
  startPauseBtn.textContent = 'Start';
});
</script>

</body>
</html>
