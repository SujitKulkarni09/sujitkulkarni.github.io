<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coding Basics — Interactive Step Simulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg-app: #1e1f22;
    --bg-panel: #26272b;
    --bg-editor: #1b1c1e;
    --bg-console: #101113;
    --border: #38393e;
    --text-main: #e3e3e6;
    --text-dim: #9a9ba1;
    --accent: #5aa9e6;
    --accent-soft: rgba(90,169,230,0.14);
    --success: #58c896;
    --warn: #e6b95a;
    --kw: #c586c0;
    --str: #d69d6b;
    --com: #7a7e85;
    --fn: #d9c96e;
    --num: #6fb3d2;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg-app);
    color: var(--text-main);
  }
  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
  }
  /* Header */
  header{
    padding:16px 24px;
    border-bottom:1px solid var(--border);
    background: var(--bg-panel);
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }
  .brand h1{
    margin:0;
    font-size:18px;
    font-weight:600;
    letter-spacing:0.2px;
  }
  .brand p{
    margin:2px 0 0 0;
    font-size:12.5px;
    color: var(--text-dim);
  }
  .progress-wrap{
    flex:1;
    min-width:200px;
    max-width:420px;
    margin:0 24px;
  }
  .progress-track{
    height:6px;
    background:var(--border);
    border-radius:3px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: var(--accent);
    width:10%;
    transition: width .25s ease;
  }
  .progress-label{
    font-size:11.5px;
    color:var(--text-dim);
    margin-top:6px;
  }
  .badge{
    font-size:11.5px;
    color: var(--text-dim);
    border:1px solid var(--border);
    padding:4px 10px;
    border-radius:20px;
  }

  /* Body layout */
  .body{
    flex:1;
    display:flex;
    min-height:0;
  }

  /* Sidebar */
  .sidebar{
    width:240px;
    flex-shrink:0;
    background: var(--bg-panel);
    border-right:1px solid var(--border);
    overflow-y:auto;
    padding:10px 0;
  }
  .step-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:10px 16px;
    cursor:pointer;
    border-left:3px solid transparent;
  }
  .step-item:hover{ background: rgba(255,255,255,0.03); }
  .step-item.active{
    background: var(--accent-soft);
    border-left-color: var(--accent);
  }
  .step-num{
    font-size:11px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    color: var(--text-dim);
    width:18px;
    padding-top:1px;
  }
  .step-item.active .step-num{ color: var(--accent); }
  .step-item.done .step-num::after{
    content: " ✓";
    color: var(--success);
  }
  .step-title{
    font-size:13px;
    line-height:1.35;
    color: var(--text-main);
  }
  .step-item.active .step-title{ font-weight:600; }

  /* Main content */
  .main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
    padding:22px 28px 10px 28px;
    gap:16px;
  }

  .concept-card{
    background: var(--bg-panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:18px 20px;
  }
  .concept-card .kicker{
    font-size:12px;
    color: var(--accent);
    font-weight:600;
    margin-bottom:6px;
  }
  .concept-card h2{
    margin:0 0 10px 0;
    font-size:20px;
  }
  .concept-card p{
    margin:0 0 8px 0;
    font-size:14.5px;
    line-height:1.55;
    color: var(--text-main);
  }
  .concept-card p:last-child{ margin-bottom:0; }
  .concept-card .analogy{
    color: var(--text-dim);
    font-style: italic;
  }

  .pane-grid{
    display:grid;
    grid-template-columns: 1fr;
    gap:14px;
  }

  /* Editor */
  .editor-panel{
    background: var(--bg-editor);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
  }
  .panel-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 14px;
    background: var(--bg-panel);
    border-bottom:1px solid var(--border);
  }
  .panel-header .file-tab{
    font-size:12.5px;
    color: var(--text-dim);
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  .dots{ display:flex; gap:6px; }
  .dots span{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .dots span:nth-child(1){ background:#e6685a; }
  .dots span:nth-child(2){ background:#e6b95a; }
  .dots span:nth-child(3){ background:#58c896; }

  .run-btn{
    background: var(--success);
    color: #0d1f16;
    border:none;
    font-weight:600;
    font-size:12.5px;
    padding:6px 14px;
    border-radius:6px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .run-btn:hover{ filter:brightness(1.08); }
  .run-btn:active{ transform: translateY(1px); }

  .code-body{
    display:flex;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size:13.5px;
    line-height:1.65;
    padding:14px 0;
    overflow-x:auto;
  }
  .line-numbers{
    text-align:right;
    padding:0 12px 0 16px;
    color: #52545a;
    user-select:none;
  }
  .code-content{
    white-space:pre;
    padding-right:20px;
  }
  .tok-kw{ color: var(--kw); }
  .tok-str{ color: var(--str); }
  .tok-com{ color: var(--com); }
  .tok-fn{ color: var(--fn); }
  .tok-num{ color: var(--num); }

  /* Console */
  .console-panel{
    background: var(--bg-console);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
  }
  .console-body{
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size:13.5px;
    line-height:1.7;
    padding:14px 16px;
    min-height:56px;
    color: #cfead9;
    white-space:pre-wrap;
  }
  .console-body .placeholder{
    color: var(--text-dim);
    font-style: italic;
  }
  .console-body .ok-line{
    color: var(--success);
  }

  /* Reference table (used on the last step) */
  .ref-table{
    width:100%;
    border-collapse:collapse;
    font-size:13.5px;
    background: var(--bg-editor);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
  }
  .ref-table th, .ref-table td{
    text-align:left;
    padding:11px 16px;
    border-bottom:1px solid var(--border);
  }
  .ref-table th{
    background: var(--bg-panel);
    color: var(--text-dim);
    font-size:12px;
    text-transform:none;
  }
  .ref-table tr:last-child td{ border-bottom:none; }
  .ref-table code{
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    color: var(--accent);
  }

  .check-box{
    border:1px dashed var(--border);
    border-radius:8px;
    padding:12px 16px;
    font-size:13.5px;
    color: var(--text-dim);
    background: rgba(255,255,255,0.02);
  }
  .check-box b{ color: var(--text-main); }

  /* Footer nav */
  footer{
    border-top:1px solid var(--border);
    background: var(--bg-panel);
    padding:12px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .nav-btn{
    background: transparent;
    border:1px solid var(--border);
    color: var(--text-main);
    padding:8px 16px;
    border-radius:6px;
    font-size:13px;
    cursor:pointer;
  }
  .nav-btn:hover{ border-color: var(--accent); color: var(--accent); }
  .nav-btn:disabled{
    opacity:0.35;
    cursor:not-allowed;
  }
  .nav-btn:disabled:hover{ border-color: var(--border); color: var(--text-main); }
  .nav-btn.primary{
    background: var(--accent);
    border-color: var(--accent);
    color:#0d1720;
    font-weight:600;
  }
  .nav-btn.primary:hover{ color:#0d1720; filter:brightness(1.08); }
  .step-count{
    font-size:12.5px;
    color: var(--text-dim);
  }

  @media (max-width: 760px){
    .sidebar{ display:none; }
    .main{ padding:16px; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <h1>Coding Basics — Interactive Simulator</h1>
      <p>Curated by Sujit Kulkarni</p>
    </div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">Step 1 of 10</div>
    </div>
    <div class="badge">Offline demo · no internet required</div>
  </header>

  <div class="body">
    <nav class="sidebar" id="sidebar"></nav>

    <main class="main">
      <section class="concept-card">
        <div class="kicker" id="kicker">CONCEPT</div>
        <h2 id="stepTitle"></h2>
        <p id="stepExplain"></p>
        <p class="analogy" id="stepAnalogy"></p>
      </section>

      <div class="pane-grid" id="paneGrid"></div>

      <div class="check-box" id="checkBox" style="display:none;"></div>
    </main>
  </div>

  <footer>
    <button class="nav-btn" id="prevBtn">&larr; Previous</button>
    <span class="step-count" id="stepCount"></span>
    <button class="nav-btn primary" id="nextBtn">Next &rarr;</button>
  </footer>

</div>

<script>
/* ---------------------------------------------------------
   Step data — each step is fully pre-built: code + the exact
   simulated output, so it always "runs" correctly offline.
--------------------------------------------------------- */
const steps = [
  {
    kicker: "1 · WHAT IS A PROGRAM",
    title: "Input → Process → Output",
    explain: "A program is just a set of instructions a computer follows, in order — nothing more mysterious than that.",
    analogy: "Everyday version: making a cup of tea. INPUT: tea bag, water, mug. PROCESS: boil → pour → wait → remove bag. OUTPUT: a cup of tea.",
    type: "code",
    code:
`# Making tea, written as a program
tea_bag = "Tea Bag"
water = "Hot Water"
mug = "Mug"

print("Making tea...")
print("INPUT:", tea_bag, water, mug)
print("PROCESS: boil -> pour -> wait -> remove bag")
print("OUTPUT: A cup of tea!")`,
    output:
`Making tea...
INPUT: Tea Bag Hot Water Mug
PROCESS: boil -> pour -> wait -> remove bag
OUTPUT: A cup of tea!`,
    check: "Think of one everyday task (making toast, getting dressed). Can you describe it as INPUT → PROCESS → OUTPUT? If yes — you just described your first program."
  },
  {
    kicker: "2 · VARIABLES",
    title: "Variables are labeled boxes",
    explain: "A variable is a labeled box that holds a piece of information, so you can refer to it later by name instead of retyping the value.",
    analogy: "Everyday version: labeled jars in a kitchen — one jar says 'sugar', another 'flour'. You just say 'add the sugar' without knowing exactly how much is inside.",
    type: "code",
    code:
`age = 25
name = "Alex"

print("The jar labeled 'age' holds:", age)
print("The jar labeled 'name' holds:", name)

age = 26   # same jar, new value inside
print("After a birthday, 'age' now holds:", age)`,
    output:
`The jar labeled 'age' holds: 25
The jar labeled 'name' holds: Alex
After a birthday, 'age' now holds: 26`,
    check: "The label ('age') stays the same — only what's inside the jar changes when you update the variable."
  },
  {
    kicker: "3 · DATA TYPES",
    title: "What kind of thing is in the box?",
    explain: "Data types describe the kind of information a variable holds, because a computer needs to know whether something is a number it can do math with, or just text.",
    analogy: "Everyday version: a whole count ('3 apples') vs. a measurement ('1.5 cups of flour') vs. a name tag vs. a yes/no light switch.",
    type: "code",
    code:
`age = 25             # integer  -> a whole count
price = 3.14          # decimal  -> a measurement
name = "hello"        # string   -> a word or sentence
is_raining = True     # boolean  -> a yes/no switch

print(type(age))
print(type(price))
print(type(name))
print(type(is_raining))`,
    output:
`<class 'int'>
<class 'float'>
<class 'str'>
<class 'bool'>`,
    check: "A jar called temperature holding 72 — what type is that? (A number, likely an integer.)"
  },
  {
    kicker: "4 · OPERATORS",
    title: "Symbols that act on values",
    explain: "Operators do something to or with values — math operators calculate, comparison operators ask a yes/no question.",
    analogy: "Everyday version: == is like asking 'is this the same?' out loud. > and < are like comparing which of two piles of coins is bigger.",
    type: "code",
    code:
`a = 10
b = 3

print("a + b =", a + b)
print("a - b =", a - b)
print("a * b =", a * b)
print("a / b =", a / b)
print("a == b:", a == b)
print("a > b:", a > b)`,
    output:
`a + b = 13
a - b = 7
a * b = 30
a / b = 3.3333333333333335
a == b: False
a > b: True`,
    check: "What operator would you use to check if temperature is above 75? (Answer: >)"
  },
  {
    kicker: "5 · SEQUENCE",
    title: "Do one thing, then the next",
    explain: "The simplest logic building block: steps run in order, one after another. Nothing fancy — just doing things in sequence.",
    analogy: "Everyday version: a morning routine. Wake up → brush teeth → make coffee.",
    type: "code",
    code:
`print("Wake up")
print("Brush teeth")
print("Make coffee")`,
    output:
`Wake up
Brush teeth
Make coffee`,
    check: "Your commute or daily walk has a sequence too — steps that always happen in the same order."
  },
  {

    title: "Make a decision based on a condition",
    explain: "This is everyday 'if this, then that' thinking — the program checks something, and does one thing or another depending on the answer.",
    analogy: "Everyday version: deciding what to wear. IF it's raining → take an umbrella, ELSE → leave it at home.",
    type: "code",
    code:
`is_raining = True

`Take an umbrella`,

while dishes_in_sink > 0:
    print("Washing one dish... left:", dishes_in_sink - 1)
    dishes_in_sink -= 1

print("Sink is empty!")`,

`Washing one dish... left: 2
Washing one dish... left: 1
Washing one dish... left: 0
Sink is empty!`,

    analogy: "1. Take one piece of mail → 2. Look who it's for → 3. IF addressed to me → 'My Mail' pile → 4. ELSE IF it's a bill → 'Bills' pile → 5. ELSE → 'Junk' pile → 6. REPEAT until the stack is empty.",

`mail_stack = [
    "Bill - Electric",
    "Letter - Me",
    "Flyer - Junk",
    "Bill - Water"
]

my_mail, bills, junk = [], [], []

for mail in mail_stack:
    if "Me" in mail:
        my_mail.append(mail)
    elif "Bill" in mail:
        bills.append(mail)
    else:
        junk.append(mail)

print("Bills:", bills)
print("Junk:", junk)`,

`My Mail: ['Letter - Me']
Bills: ['Bill - Electric', 'Bill - Water']
Junk: ['Flyer - Junk']`,
    check: "Spot it: Sequence (steps in order) + Selection (the if/elif/else) + Iteration (the for-loop over the stack)."
  },
  {
    kicker: "9 · WHY PYTHON",
    title: "Reads almost like plain English",
    explain: "Python is readable, beginner-friendly, backed by a huge community, and versatile — the same language works for web apps, data analysis, automation, and AI.",
    analogy: "Everyday version: if programming languages were spoken languages, Python has the simplest grammar and the most people willing to help you practice.",
    type: "code",
    code:
`age = 20

if age > 18:
    print("You are an adult")

# This line reads almost like a plain-English sentence:
# "if age is greater than 18, print you are an adult"`,
    output:
`You are an adult`,
    check: "Notice the code reads like the sentence you'd actually say out loud — that's Python's whole design philosophy."
  },
  {
    kicker: "10 · WHAT'S NEXT",
    title: "Mapping what you know onto Python syntax",
    explain: "Once these ideas feel natural, translating them into Python syntax is just learning vocabulary for concepts you already understand.",
    analogy: "You've already done the hard part: learning to think in sequence, selection, and iteration. Python is just the vocabulary.",
    type: "table",
    rows: [
      ["Variables & data types", "<code>x = 5</code> &nbsp; <code>name = \"Alex\"</code>"],
      ["Selection", "<code>if</code> / <code>elif</code> / <code>else</code>"],
      ["Iteration", "<code>for</code> and <code>while</code> loops"],

    ],
    check: "From here: Python Foundations → Data Structures & Functions → Data Handling & Analysis → SQL Foundations → and onward into AI/LLM Engineering."
  }
];

/* ---------------------------------------------------------
   Tiny Python-ish syntax highlighter (regex-based, offline)
--------------------------------------------------------- */
function highlight(code){
  const keywords = ["if","elif","else","while","for","in","print","True","False","and","or","not","return","def"];
  const lines = code.split("\n");
  return lines.map(line => {
    let escaped = line
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

    // comments
    const commentIdx = escaped.indexOf("#");
    let codePart = escaped, commentPart = "";
    if(commentIdx !== -1){
      codePart = escaped.slice(0, commentIdx);
      commentPart = '<span class="tok-com">' + escaped.slice(commentIdx) + '</span>';
    }

    // strings
    codePart = codePart.replace(/(&quot;|")([^"]*)(")/g, (m) => {
      return '<span class="tok-str">' + m + '</span>';
    });
    codePart = codePart.replace(/'([^']*)'/g, (m) => '<span class="tok-str">' + m + '</span>');

    // numbers
    codePart = codePart.replace(/\b(\d+\.?\d*)\b/g, '<span class="tok-num">$1</span>');

    // keywords / builtins
    keywords.forEach(kw => {
      const re = new RegExp('\\b(' + kw + ')\\b(?![^<]*>)', 'g');
      codePart = codePart.replace(re, '<span class="' + (kw === "print" ? "tok-fn" : "tok-kw") + '">$1</span>');
    });

    return codePart + commentPart;
  }).join("\n");
}

/* ---------------------------------------------------------
   Render logic
--------------------------------------------------------- */
let current = 0;
const completed = new Set();

const sidebar = document.getElementById("sidebar");
const paneGrid = document.getElementById("paneGrid");
const checkBox = document.getElementById("checkBox");

function buildSidebar(){
  sidebar.innerHTML = "";
  steps.forEach((s, i) => {
    const item = document.createElement("div");
    item.className = "step-item" + (i === current ? " active" : "") + (completed.has(i) ? " done" : "");
    item.innerHTML = `<span class="step-num">${i+1}</span><span class="step-title">${s.title}</span>`;
    item.addEventListener("click", () => goTo(i));
    sidebar.appendChild(item);
  });
}

function buildPanes(step){
  paneGrid.innerHTML = "";

  if(step.type === "code"){
    const editor = document.createElement("div");
    editor.className = "editor-panel";
    const lineCount = step.code.split("\n").length;
    let lineNums = "";
    for(let i=1;i<=lineCount;i++) lineNums += i + "\n";

    editor.innerHTML = `
      <div class="panel-header">
        <div class="dots"><span></span><span></span><span></span></div>
        <div class="file-tab">lesson_${current+1}.py</div>
        <button class="run-btn" id="runBtn">▶ Run</button>
      </div>
      <div class="code-body">
        <div class="line-numbers">${lineNums}</div>
        <div class="code-content">${highlight(step.code)}</div>
      </div>
    `;
    paneGrid.appendChild(editor);

    const consolePanel = document.createElement("div");
    consolePanel.className = "console-panel";
    consolePanel.innerHTML = `
      <div class="panel-header">
        <div class="file-tab">Output</div>
        <div class="file-tab" id="runStatus"></div>
      </div>
      <div class="console-body" id="consoleBody"><span class="placeholder">Press ▶ Run to see the output for this step.</span></div>
    `;
    paneGrid.appendChild(consolePanel);

    document.getElementById("runBtn").addEventListener("click", () => {
      const body = document.getElementById("consoleBody");
      const status = document.getElementById("runStatus");
      body.innerHTML = "";
      status.textContent = "running...";
      let i = 0;
      const lines = step.output.split("\n");
      function typeLine(){
        if(i < lines.length){
          const div = document.createElement("div");
          div.textContent = lines[i];
          body.appendChild(div);
          i++;
          setTimeout(typeLine, 90);
        } else {
          const done = document.createElement("div");
          done.className = "ok-line";
          done.textContent = "✓ Program finished";
          body.appendChild(done);
          status.textContent = "done";
          completed.add(current);
          buildSidebar();
        }
      }
      typeLine();
    });

  } else if(step.type === "table"){
    const wrap = document.createElement("table");
    wrap.className = "ref-table";
    wrap.innerHTML = `
      <tr><th>Concept you already know</th><th>Python syntax version</th></tr>
      ${step.rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}
    `;
    paneGrid.appendChild(wrap);
    completed.add(current);
    buildSidebar();
  }
}

function render(){
  const step = steps[current];
  document.getElementById("kicker").textContent = step.kicker;
  document.getElementById("stepTitle").textContent = step.title;
  document.getElementById("stepExplain").textContent = step.explain;
  document.getElementById("stepAnalogy").textContent = step.analogy;

  buildPanes(step);

  if(step.check){
    checkBox.style.display = "block";
    checkBox.innerHTML = "<b>Check yourself:</b> " + step.check;
  } else {
    checkBox.style.display = "none";
  }

  document.getElementById("progressFill").style.width = ((current+1)/steps.length*100) + "%";
  document.getElementById("progressLabel").textContent = `Step ${current+1} of ${steps.length}`;
  document.getElementById("stepCount").textContent = `${current+1} / ${steps.length}`;

  document.getElementById("prevBtn").disabled = current === 0;
  document.getElementById("nextBtn").textContent = current === steps.length - 1 ? "Finish ✓" : "Next →";
  document.getElementById("nextBtn").disabled = current === steps.length - 1 && completed.has(current) === false && step.type !== "table" ? false : false;

  buildSidebar();
}

function goTo(i){
  current = i;
  render();
}

document.getElementById("prevBtn").addEventListener("click", () => {
  if(current > 0){ current--; render(); }
});
document.getElementById("nextBtn").addEventListener("click", () => {
  if(current < steps.length - 1){ current++; render(); }
});

render();
</script>
</body>
</html>
